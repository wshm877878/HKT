name: Build SKSE DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        run: choco install ninja

      - name: Fetch required vcpkg baseline commit
        run: |
          cd "$env:VCPKG_INSTALLATION_ROOT"
          git fetch origin 1577f17ee57f42a0ef6d75bbb82cb37d0b76d7e8

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCIGAR_RELEASE=ON

      - name: Build CIGAR DLL
        run: |
          cmake --build build

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: CIGAR-Chinese-DLL
          path: |
            build/CIGAR.dll
            build/Release/CIGAR.dll
          if-no-files-found: error
