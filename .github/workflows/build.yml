- name: Configure CMake
        shell: powershell
        run: |
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/triplets/community/x64-windows-static-md.cmake") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/triplets/community/x64-windows-static-md.cmake" "$env:VCPKG_INSTALLATION_ROOT/triplets/x64-windows-static-md.cmake" -Force
          }
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCIGAR_RELEASE=ON

      - name: Build CIGAR DLL
        shell: powershell
        run: |
          cmake --build build -v 2>&1 | Tee-Object -FilePath "compile_error.txt"

      - name: Package Release Mod Structure
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "package/SKSE/Plugins"
          $cigarDll = Get-ChildItem -Path "build" -Filter "CIGAR.dll" -Recurse | Select-Object -First 1
          if ($cigarDll) {
            Copy-Item $cigarDll.FullName "package/SKSE/Plugins/CIGAR.dll" -Force
            Copy-Item $cigarDll.FullName "CIGAR.dll" -Force
          }
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse | ForEach-Object {
            if ($_.Name -ne "CIGAR.dll") {
              Copy-Item $_.FullName "package/SKSE/Plugins/$($_.Name)" -Force
              Write-Host "Bundled extra DLL: $($_.Name)"
            }
          }
          if (Test-Path "dist/CIGAR.json") {
            Copy-Item "dist/CIGAR.json" "package/SKSE/Plugins/CIGAR.json"
          }
          if (Test-Path "dist/README-release.md") {
            Copy-Item "dist/README-release.md" "package/README.md"
          }
          Compress-Archive -Path "package/*" -DestinationPath "CIGAR-Chinese-Mod.zip" -Force
