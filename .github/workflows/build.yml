name: Build SKSE DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove outdated vcpkg baseline
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("vcpkg.json", "utf8"));
            delete pkg["builtin-baseline"];
            fs.writeFileSync("vcpkg.json", JSON.stringify(pkg, null, 2));
          '

      - name: Force UTF-8 with BOM on all source files
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir) {
              for (const file of fs.readdirSync(dir)) {
                const full = path.join(dir, file);
                if (fs.statSync(full).isDirectory()) walk(full);
                else if (/\.(cpp|c|h|hpp)$/i.test(full)) {
                  let buf = fs.readFileSync(full);
                  // Ensure UTF-8 BOM: 0xEF, 0xBB, 0xBF
                  if (!(buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF)) {
                    buf = Buffer.concat([Buffer.from([0xEF, 0xBB, 0xBF]), buf]);
                    fs.writeFileSync(full, buf);
                  }
                }
              }
            }
            if (fs.existsSync("src")) walk("src");
            if (fs.existsSync("include")) walk("include");
          '

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCIGAR_RELEASE=ON

      - name: Build CIGAR DLL
        run: |
          cmake --build build

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: CIGAR-Chinese-DLL
          path: |
            build/CIGAR.dll
            build/Release/CIGAR.dll
          if-no-files-found: error
